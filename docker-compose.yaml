# Entorno local de base de datos para Petora.
# Toma DB_NAME y DB_PASSWORD del archivo .env.
# Uso: docker compose up -d
services:
  db:
    image:
      postgres:17.6
    restart:
      always
    # Puerto expuesto en el host: 5432 (debe coincidir con DB_PORT del .env).
    ports:
      - "5432:5432"
    container_name:
      petoradb
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Volumen de datos de PostgreSQL montado en ./postgres.
    volumes:
      - ./postgres:/var/lib/postgrestql/data

volumes:
    postgres:

